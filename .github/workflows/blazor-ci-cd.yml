name: Blazor WASM CI/CD

# On push to branch, or on manual trigger:
#     run unit test and publish Blazor WASM app to GitHub Pages.
# on PR targetting branch
#     run unit tests only,

on:
  push:
    branches: [ "main", "dev" ]
  pull_request:
    branches: [ "main", "dev" ]
  workflow_dispatch:    # manual pipeline trigger option

permissions:
  contents: write

jobs:
  blazor-wasm-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore WASM unit test project
        run: dotnet restore src/apps/Cookbook.Web/Cookbook.Web.UnitTest/Cookbook.Web.UnitTest.csproj

      - name: Run WASM unit tests
        run: dotnet test src/apps/Cookbook.Web/Cookbook.Web.UnitTest/Cookbook.Web.UnitTest.csproj --configuration Release --no-restore

  blazor-wasm-deploy:
    needs: blazor-wasm-tests
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Publish WASM project
        run: dotnet publish src/apps/Cookbook.Web/Cookbook.Web/Cookbook.Web.csproj --configuration Release --output ./publish

      - name: Copy index.html to 404.html
        run: cp publish/wwwroot/index.html publish/wwwroot/404.html

      # Deploy directly to the root of the gh-pages branch
      - name: Commit and Deploy to Production
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: gh-pages
          folder: publish/wwwroot